name: Build Kedge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Download Frida devkits
        run: |
          FRIDA_VERSION=17.22.2
          mkdir -p include lib
          curl -sLO https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gum-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          curl -sLO https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gumjs-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          tar xf frida-gum-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          tar xf frida-gumjs-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          find . -name 'frida-gum.h' -not -path './include/*' -exec cp {} include/ \;
          find . -name 'libfrida-gum.a' -not -path './lib/*' -exec cp {} lib/ \;
          find . -name 'frida-gumjs.h' -not -path './include/*' -exec cp {} include/ \;
          find . -name 'libfrida-gumjs.a' -not -path './lib/*' -exec cp {} lib/ \;

      - name: Download GLib headers
        run: |
          curl -sLO https://snapshot.debian.org/archive/debian/20230611T000000Z/pool/main/g/glib2.0/libglib2.0-dev_2.74.6-2_arm64.deb
          ls -la libglib2.0-dev_2.74.6-2_arm64.deb
          ar x libglib2.0-dev_2.74.6-2_arm64.deb
          mkdir -p extract
          tar -C extract -xf data.tar.xz
          mkdir -p include/glib-2.0
          cp -R extract/usr/include/glib-2.0/glib include/glib-2.0/
          cp extract/usr/include/glib-2.0/glib.h include/glib-2.0/glib.h
          find extract -name glibconfig.h -exec cp {} include/glib-2.0/glibconfig.h \;
          echo "--- glibconfig.h ---"
          ls -la include/glib-2.0/glibconfig.h
          grep -E "G_BYTE_ORDER|GLIB_SIZEOF_LONG|GPid" include/glib-2.0/glibconfig.h | head

      - name: Build
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          make SDK_PATH="$SDK_PATH"

      - name: Sign
        run: ldid -Sentitlements.plist kedge

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kedge
          path: kedge