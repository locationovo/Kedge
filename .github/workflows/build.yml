name: Build Kedge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg

      - name: Download Frida devkits
        run: |
          FRIDA_VERSION=17.22.2
          mkdir -p include lib
          curl -sLO https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gum-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          curl -sLO https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gumjs-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          tar xf frida-gum-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          tar xf frida-gumjs-devkit-${FRIDA_VERSION}-ios-arm64.tar.xz
          find . -name 'frida-gum.h' -not -path './include/*' -exec cp {} include/ \;
          find . -name 'libfrida-gum.a' -not -path './lib/*' -exec cp {} lib/ \;
          find . -name 'frida-gumjs.h' -not -path './include/*' -exec cp {} include/ \;
          find . -name 'libfrida-gumjs.a' -not -path './lib/*' -exec cp {} lib/ \;

      - name: Download GLib headers
        run: |
          SNAPSHOT=20240101T000000Z
          PKG=libglib2.0-dev_2.74.6-2_arm64.deb
          URL="https://snapshot.debian.org/archive/debian/${SNAPSHOT}/pool/main/g/glib2.0/${PKG}"
          curl -sSL -o glib.deb "$URL"
          file glib.deb
          if ! file glib.deb | grep -q 'Debian binary package'; then
            echo "wrong file type, trying deb.debian.org"
            curl -sSL -o glib.deb \
              "http://deb.debian.org/debian/pool/main/g/glib2.0/libglib2.0-dev_2.74.6-2+deb12u3_arm64.deb"
            file glib.deb
          fi
          mkdir -p extract
          dpkg-deb -x glib.deb extract
          mkdir -p include/glib-2.0
          cp -R extract/usr/include/glib-2.0/glib include/glib-2.0/
          cp extract/usr/include/glib-2.0/glib.h include/glib-2.0/glib.h
          find extract -name glibconfig.h -exec cp {} include/glib-2.0/glibconfig.h \;
          echo "--- glibconfig.h ---"
          ls -la include/glib-2.0/glibconfig.h
          grep -E "G_BYTE_ORDER|GLIB_SIZEOF_LONG|typedef int GPid|typedef.*GPid" include/glib-2.0/glibconfig.h | head

      - name: Build
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          make SDK_PATH="$SDK_PATH"

      - name: Sign
        run: |
          ldid -Sentitlements.plist kedge
          ldid -S libkedge_repl.dylib
          ldid -S kg_agent.dylib

      - name: Package .deb
        run: |
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/var/jb/usr/local/bin
          mkdir -p pkg/var/jb/usr/local/lib
          cp kedge pkg/var/jb/usr/local/bin/kedge
          cp libkedge_repl.dylib pkg/var/jb/usr/local/lib/libkedge_repl.dylib
          cp kg_agent.dylib pkg/var/jb/usr/local/lib/kg_agent.dylib
          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.locationovo.kedge
          Name: kedge
          Version: 0.1.0
          Architecture: iphoneos-arm64
          Description: Local Frida-based instrumentation client for iOS
          Maintainer: locationovo
          Author: locationovo
          Section: Utilities
          Priority: optional
          Depends: firmware (>= 14.0)
          EOF
          chmod +x pkg/var/jb/usr/local/bin/kedge
          dpkg-deb -Zgzip --build pkg kedge_0.1.0_iphoneos-arm64.deb
          ls -la kedge_0.1.0_iphoneos-arm64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kedge-deb
          path: kedge_0.1.0_iphoneos-arm64.deb